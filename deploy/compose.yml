# Runs on gtm-apps-1 as compose project "crawldoctor". The deploy workflow sends this file to the
# host, where /opt/gtm/bin/deploy-app renders .env from SSM (/gtm/crawldoctor/*) and sets IMAGE.
# No published ports: Caddy (on the shared "gtm" network) proxies crawldoctor.agitracker.io to
# crawldoctor:8000. RabbitMQ is only on this project's own network, so nothing else (and no
# route) reaches it.
services:
  crawldoctor:
    image: ${IMAGE:?IMAGE is set by deploy-app}
    env_file: .env
    restart: unless-stopped
    # Public tracking traffic from getmaxim.ai and getbifrost.ai lands here. It used at most
    # about 270 MiB (Oct 2026), so 1g still leaves room for a traffic spike.
    mem_limit: 1g
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [gtm, internal]

  rabbitmq:
    image: rabbitmq:4.3.5@sha256:078107e036374f4d9bbeab8766799abe474bf252aedb4617ddd2edfa8e2c2c05
    # A fixed hostname keeps the node name (rabbit@rabbitmq), so queued messages in the volume
    # survive a container replacement.
    hostname: rabbitmq
    environment:
      # Read from .env (/gtm/crawldoctor/*). They only take effect on an empty volume; to change
      # the password later, use rabbitmqctl change_password inside the container.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    # Each check starts a CLI Erlang VM in this container: about 1.5 s of CPU. Every 15 s that was
    # 97% of the broker's CPU (about 10% of a core, Oct 2026), so after startup it runs every
    # 5 minutes. While starting it checks every 5 s, so crawldoctor (depends_on: service_healthy)
    # and deploy-app don't wait longer. Nothing acts on the health status after that.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5m
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 5
    networks: [internal]

volumes:
  rabbitmq-data:

networks:
  gtm:
    external: true
  internal:
