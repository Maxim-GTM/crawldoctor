server {
    listen 8000;
    server_name _;
    client_max_body_size 10M;
    
    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;
    
    # Serve frontend. Browsers check the page with the server on every load, so a deploy shows
    # up straight away (an hour's caching kept the old build in the hub's frame after a deploy).
    location / {
        root /app/frontend;
        try_files $uri $uri/ /index.html;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # Build output: every file name carries a hash of its contents, so it never changes
    location /assets/ {
        root /app/frontend;
        # A chunk from an older build is a 404, not the page, so an open tab reloads itself
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    
    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Tracking endpoints (fast responses expected)
    location ~ ^/track/(js|event|status).*$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        # Add keepalive for better performance
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # Test pages (iframe mockup) – backend
    location /test/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Other backend routes
    location ~ ^/(health|docs|openapi.json).*$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}

